<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        body{
            background-color: brown;
        }
        .container{
            position: absolute;
            display: grid;
            gap: 1em;
            border: 2px solid black;
            margin: 10px;
            width: 120px;
            height: 120px;
            justify-content: center;
            align-content: center;
            padding: 12px;
            /* padding-left: 12px; */
            background-color: antiquewhite;
            /* border-radius: 20px; */

            grid-template-columns:1fr 1fr 1fr ;
            grid-template-rows:1fr 1fr 1fr ;

            grid-template-areas:
            'top-left . top-right'
            'left  center   right' 
            'bottom-left . bottom-right';
            box-sizing: border-box;
           
        }
        .container div{
            height: 25px;
            width: 25px;
            border-radius: 50%;
            background-color: black;
            align-self: center;
        }
        .top-left{
            grid-area: top-left;
        }
        .left{
            grid-area: left;
        }
         .bottom-left{
            grid-area: bottom-left;
        }
        .top-right{
            grid-area: top-right;
        }
        .right{
            grid-area: right;
        }
        .bottom-right{
            grid-area: bottom-right;
        }
        .center{
            grid-area: center;
        }
        .scene{
            width: 120px;
            height: 120px;
            margin: 100px auto;
            perspective: 800px;
        }
        .cube{
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: spin 18s infinite linear;
            animation-play-state: paused;
           
        }
        .front     { transform: rotateY(0deg) translateZ(60px);}
        .back      { transform: rotateY(180deg) translateZ(60px);}
        .left-cube { transform: rotateY(-90deg) translateZ(60px);}
        .right-cube{ transform: rotateY(90deg) translateZ(60px);}
        .top       { transform: rotateX(90deg) translateZ(60px);}
        .bottom    { transform: rotateX(-90deg) translateZ(60px);}
         
        .btn{
            display:none;
        }
        .btn:checked ~ .scene .cube{
            animation-play-state: running;
        }
        .lable-btn{
            text-align: center;
        }
        .button{
            padding: 10px 20px;
            background-color: #1da18e;
            color: antiquewhite;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            &:hover{
                background-color: #178d7b;
                color: white;
            }
        }
        @keyframes spin{
            from{transform: rotateX(0deg) rotateY(0deg);}
            to{transform: rotateX(360deg) rotateY(720deg);}
        }
    </style>
</head>
<body>
  <input type="checkbox" class="btn" id="hidden-btn">
    <div class="scene">
        <div class="cube">
             <div class="container front">
                <div class="center"></div>
            </div>
            <div class="container back">
                <div class="top-left"></div>
                <div class="bottom-right"></div>
            </div>
            <div class="container left-cube">
                <div class="top-left"></div>
                <div class="center"></div>
                <div class="bottom-right"></div>
            </div>
            <div class="container right-cube">
                <div class="top-left"></div>
                <div class="bottom-left"></div>
                <div class="top-right"></div>
                <div class="bottom-right"></div>
            </div>
            <div class="container top">
                <div class="top-left"></div>
                <div class="bottom-left"></div>
                <div class="center"></div>
                <div class="top-right"></div>
                <div class="bottom-right"></div>
            </div>
            <div class="container bottom">
                <div class="top-left"></div>
                <div class="left"></div>
                <div class="bottom-left"></div>
                <div class="top-right"></div>
                <div class="right"></div>
                <div class="bottom-right"></div>
            </div>
        </div>
    </div>
    <div class="lable-btn">
        <label for="hidden-btn" class="button">Click Me!</label>
    </div>
</body>
</html>
